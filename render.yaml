services:
  - type: web
    name: health-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/health_tracker.db
      - key: ALLOWED_ORIGINS
        value: https://health-tracker-web.vercel.app
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
